<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ZIRO - Job Details</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<div style="background:var(--green); padding:20px 16px; border-radius:0 0 20px 20px; color:white;">
<div onclick="window.location.href='index.html'" style="font-size:14px;">← Back to Home</div>
<h2 style="margin:12px 0 4px;">Job Details</h2><p style="margin:0; color:var(--gold); font-size:13px;">Review before you accept.</p></div>
<div style="padding:16px; padding-bottom:120px;"><div id="jobDetail" style="background:white; border-radius:16px; padding:18px;"></div>
<div style="background:white; border-radius:16px; padding:16px; margin-top:12px;"><button class="btn-primary" onclick="acceptThisJob()">Accept This Job</button>
<button class="btn-secondary" style="margin-top:8px;" onclick="window.location.href='chat.html'">Message Customer</button>
<p style="font-size:12px; color:var(--muted); text-align:center;">ZIRO does NOT hold job money.<br>You pay / get paid directly after work.</p></div></div>
<div style="position:fixed; bottom:0; left:0; right:0; background:white; border-top:1px solid #eee; display:flex; justify-content:space-around; padding:10px 0; font-size:11px; text-align:center;"><span onclick="window.location.href='index.html'">🏠<br>Home</span><span onclick="window.location.href='index.html'">🔍<br>Search</span><span onclick="window.location.href='post.html'" style="background:var(--gold); width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:900; margin-top:-24px;">+</span><span onclick="window.location.href='chat.html'">💬<br>Chat</span><span onclick="window.location.href='office.html'">👤<br>My Office</span></div>
<script src="js/notify.js"></script><script>
let currentJob = null;
function loadJob(){
  const id = new URLSearchParams(window.location.search).get('id');
  const jobs = JSON.parse(localStorage.getItem('ziro_jobs') || '[]');
  currentJob = jobs[Number(id)] || jobs[jobs.length-1];
  if(!currentJob){ document.getElementById('jobDetail').innerHTML = '<p>Job not found.</p>'; return; }
  document.getElementById('jobDetail').innerHTML = '<span style="background:#FFF8E1; border:1px solid var(--gold); padding:4px 10px; border-radius:999px; font-size:12px; font-weight:700;">OPEN • ' + currentJob.skill + '</span>'
    + '<h3 style="margin:12px 0 6px;">' + currentJob.skill + ' needed</h3>'
    + '<p style="font-size:14px; color:#333; line-height:1.5;">' + currentJob.desc + '</p>'
    + '<hr style="border:none; border-top:1px solid #eee; margin:14px 0;">'
    + '<p style="font-size:14px; margin:6px 0;">📍 <b>Location:</b> ' + currentJob.city + '</p>'
    + '<p style="font-size:14px; margin:6px 0;">💰 <b>Budget:</b> ₦' + Number(currentJob.budget).toLocaleString() + '</p>'
    + '<p style="font-size:14px; margin:6px 0;">👤 <b>Posted by:</b> ' + (currentJob.name || 'Customer') + '</p>'
    + '<p style="font-size:13px; color:var(--muted);">Posted: Just now • Status: Open</p>';
}
function acceptThisJob(){
  if(!currentJob) return;
  ziroConfirm('Accept This Job?', currentJob.skill + ' in ' + currentJob.city + ' for ₦' + Number(currentJob.budget).toLocaleString() + '.<br><br>Customer will be notified.', function(){
    ziroNotify('Job Accepted', 'You have accepted the ' + currentJob.skill + ' job.<br>Please message the customer in Chat to agree time.', 'Go to Chat');
    document.querySelector('#jobDetail').insertAdjacentHTML('beforeend', '<p style="margin-top:12px;"><b style="color:var(--success);">✓ You accepted this job</b></p>');
  });
}
document.addEventListener('DOMContentLoaded', loadJob);
</script></body></html>
