<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZIRO - Chat</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div style="background:var(--green); padding:20px 16px; border-radius:0 0 20px 20px; color:white;">
  <div onclick="window.location.href='index.html'" style="font-size:14px;">← Back to Home</div>
  <h2 style="margin:12px 0 4px;">Chat 💬</h2>
  <p style="margin:0; color:var(--gold); font-size:13px;">Talk to worker before you hire.</p>
</div>
<div style="padding:16px; padding-bottom:120px;">
  <div id="chatList" style="display:flex; flex-direction:column; gap:12px;"></div>
  <div style="background:white; border-radius:16px; padding:16px; margin-top:12px;">
    <label style="font-size:13px; font-weight:700;">Send a message</label>
    <select id="cTo" style="width:100%; padding:12px; border-radius:12px; border:1px solid #ddd; margin:8px 0;">
      <option>Musa A. - Plumber</option><option>Ada O. - Cleaner</option><option>Tunde B. - Electrician</option><option>Chidi N. - Driver</option>
    </select>
    <input id="cMsg" placeholder="Type message e.g. How much for today?" style="width:100%; box-sizing:border-box; padding:12px; border-radius:12px; border:1px solid #ddd; margin-bottom:10px;">
    <button class="btn-primary" onclick="sendMsg()">Send Message</button>
    <p style="font-size:12px; color:var(--muted); text-align:center;">Never send job money in chat. Pay worker directly after work.</p>
  </div>
  <button class="btn-sos" style="margin-top:12px;" onclick="sosEmergency()">! SOS • Emergency</button>
</div>
<div style="position:fixed; bottom:0; left:0; right:0; background:white; border-top:1px solid #eee; display:flex; justify-content:space-around; padding:10px 0; font-size:11px; text-align:center;"><span onclick="window.location.href='index.html'">🏠<br>Home</span><span onclick="window.location.href='index.html'">🔍<br>Search</span><span onclick="window.location.href='post.html'" style="background:var(--gold); width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:900; margin-top:-24px;">+</span><span><b>💬<br>Chat</b></span><span onclick="window.location.href='office.html'">👤<br>My Office</span></div>
<script src="js/app.js"></script>
<script>
function loadChat(){
  const list = document.getElementById('chatList');
  const msgs = JSON.parse(localStorage.getItem('ziro_chat') || '[]');
  if(!msgs.length){
    list.innerHTML = '<div style="background:white; border-radius:16px; padding:16px; text-align:center;"><b>Musa A. - Plumber</b><p style="font-size:13px; color:var(--muted); margin:6px 0 0;">Hello, I can fix your tap today. Are you in Wuse 2?</p></div>';
    return;
  }
  list.innerHTML = msgs.map(m => '<div style="background:white; border-radius:16px; padding:16px;"><b>' + m.to + '</b><p style="font-size:13px; margin:6px 0 0;">' + m.msg + '</p><p style="font-size:11px; color:var(--muted); margin:4px 0 0;">You • Just now</p></div>').join('');
}
function sendMsg(){
  const to = document.getElementById('cTo').value;
  const msg = document.getElementById('cMsg').value.trim();
  if(!msg){ alert('Type a message first.'); return; }
  const msgs = JSON.parse(localStorage.getItem('ziro_chat') || '[]');
  msgs.push({ to, msg });
  localStorage.setItem('ziro_chat', JSON.stringify(msgs));
  document.getElementById('cMsg').value = '';
  loadChat();
  alert('Message sent to ' + to + ' ✅\n\n(DEMO) In real app, worker will reply here.');
}
document.addEventListener('DOMContentLoaded', loadChat);
</script>
</body>
</html>
