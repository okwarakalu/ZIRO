<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ZIRO - Chat</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body style="background:#0F766E; margin:0; padding-bottom:72px;">
<div style="background:#0B3D2E; padding:12px 14px; display:flex; align-items:center; gap:10px; color:white; position:sticky; top:0; z-index:10;">
  <span onclick="window.location.href='chat.html'" style="font-size:20px;">←</span>
  <div id="chatAvatar" style="width:40px; height:40px; min-width:40px; background:#F2C94C; color:#0B3D2E; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:900;">S</div>
  <div style="flex:1; min-width:0;">
    <b id="chatName" style="display:block; font-size:16px;">Segun O.</b>
    <span id="chatSkill" style="font-size:12px; color:#A7F3D0;">● Available • Barber</span>
  </div>
  <button onclick="startCall('Voice')" style="background:rgba(255,255,255,0.15); color:white; border:none; padding:8px 12px; border-radius:999px; font-size:12px;">📞 Call</button>
  <button onclick="startCall('Video')" style="background:#F2C94C; color:#0B3D2E; border:none; padding:8px 12px; border-radius:999px; font-size:12px; font-weight:800;">🎥 Video</button>
</div>
<div style="padding:10px 12px;">
  <div style="background:rgba(255,255,255,0.9); border-radius:12px; padding:10px 12px; display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
    <span style="font-size:13px;">📋 <b>Job:</b> <span id="jobLabel">Segun O. • Job</span></span>
    <button onclick="window.location.href='index.html'" style="background:#0B6E4F; color:white; border:none; padding:7px 12px; border-radius:999px; font-size:12px; font-weight:800;">View Job</button>
  </div>
  <p style="text-align:center; font-size:11px; color:#CCFBF1; background:rgba(0,0,0,0.2); padding:6px 10px; border-radius:999px; width:fit-content; margin:0 auto 12px;">ZIRO Secure • Today • Chat started</p>
  <div id="messages"></div>
</div>

<!-- CALL SCREEN -->
<div id="callScreen" style="display:none; position:fixed; inset:0; background:#0B3D2E; z-index:9999; flex-direction:column; align-items:center; justify-content:center; color:white; padding:20px; text-align:center;">
  <div id="callAvatar" style="width:90px; height:90px; background:#F2C94C; color:#0B3D2E; border-radius:30px; display:flex; align-items:center; justify-content:center; font-size:42px; font-weight:900;">S</div>
  <b id="callName" style="font-size:22px; margin-top:16px;">Segun O.</b>
  <p id="callStatus" style="color:#A7F3D0; margin:8px 0;">Calling...</p>
  <p id="callTimer" style="font-size:32px; font-weight:900; margin:10px 0;">00:00</p>
  <p style="font-size:12px; color:#B8D8CC;">ZIRO Call • Voice stays inside ZIRO</p>
  <button onclick="endCall()" style="background:#D32F2F; color:white; border:none; padding:16px 30px; border-radius:999px; font-size:16px; font-weight:900; margin-top:20px;">📞 End Call</button>
</div>

<!-- FIXED INPUT BAR - Send always visible -->
<div style="position:fixed; bottom:0; left:0; right:0; background:white; padding:10px 8px; display:flex; gap:6px; align-items:center; box-sizing:border-box; border-top:1px solid #eee;">
  <button onclick="ziroNotify('Attach','Photo / File coming soon in ZIRO. Send text or voice for now.')" style="width:36px; min-width:36px; height:38px; border-radius:50%; border:1px solid #ddd; background:white; font-size:18px; padding:0;">+</button>
  <input id="msgInput" placeholder="Type message..." style="flex:1; min-width:0; padding:11px 12px; border:1px solid #ddd; border-radius:999px; font-size:14px; box-sizing:border-box;">
  <button id="voiceBtn" onclick="toggleVoice()" style="min-width:52px; background:#CCFBF1; color:#0B3D2E; border:none; padding:10px 8px; border-radius:999px; font-size:12px; font-weight:800;">🎤 Voice</button>
  <button onclick="sendMsg()" style="min-width:58px; background:#F2C94C; color:#0B3D2E; border:none; padding:11px 10px; border-radius:999px; font-size:13px; font-weight:900;">Send</button>
</div>
<script src="js/notify.js"></script>
<script src="js/workers.js"></script>
<script>
let withName='Segun O.', callTimerInt=null, callSecs=0, isRecording=false;
function loadChat(){
  withName = new URLSearchParams(location.search).get('with') || localStorage.getItem('ziro_chat_with') || 'Segun O.';
  const all = typeof ziroGetWorkers==='function' ? ziroGetWorkers() : [];
  const w = all.find(x=>x.name===withName) || {skill:'Worker', price:5000};
  document.getElementById('chatAvatar').textContent = withName[0];
  document.getElementById('chatName').textContent = withName;
  document.getElementById('chatSkill').textContent = '● Available • '+w.skill+' • ₦'+Number(w.price).toLocaleString();
  document.getElementById('jobLabel').textContent = withName+' • '+w.skill+' Job';
  let chats = JSON.parse(localStorage.getItem('ziro_chats') || '[]');
  if(!chats.includes(withName)){ chats.unshift(withName); localStorage.setItem('ziro_chats', JSON.stringify(chats)); }
  const key='ziro_msgs_'+withName;
  let msgs = JSON.parse(localStorage.getItem(key) || 'null');
  if(!msgs){
    msgs=[
      {from:'other', text:'Hello, I can do this '+String(w.skill).toLowerCase()+' work. Are you in my area?', time:'12:19'},
      {from:'me', text:'Yes, I am around. How much for today?', time:'12:20'},
      {from:'other', text:'₦'+Number(w.price).toLocaleString()+'. I can come by 2pm. Is that okay?', time:'12:21'},
    ];
    localStorage.setItem(key, JSON.stringify(msgs));
  }
  renderMsgs(msgs);
}
function renderMsgs(msgs){
  document.getElementById('messages').innerHTML = msgs.map(m=>{
    if(m.voice) return '<div style="background:#0B6E4F; color:white; padding:12px 14px; border-radius:16px 16px 4px 16px; max-width:80%; margin:0 0 10px auto;"><b style="font-size:11px; color:#F2C94C;">YOU • VOICE 🎤 '+m.voice+'</b><p style="margin:4px 0 0; font-size:14px;">▶ Voice message — Tap to play in ZIRO</p><p style="margin:6px 0 0; font-size:11px; text-align:right; color:#A7F3D0;">'+m.time+' ✓✓</p></div>';
    if(m.from==='me') return '<div style="background:#0B6E4F; color:white; padding:12px 14px; border-radius:16px 16px 4px 16px; max-width:80%; margin:0 0 10px auto;"><b style="font-size:11px; color:#F2C94C;">YOU • WORKER</b><p style="margin:4px 0 0; font-size:14px; line-height:1.4;">'+m.text+'</p><p style="margin:6px 0 0; font-size:11px; text-align:right; color:#A7F3D0;">'+m.time+' ✓✓</p></div>';
    return '<div style="background:#FEF3C7; padding:12px 14px; border-radius:16px 16px 16px 4px; max-width:80%; margin:0 0 10px;"><b style="font-size:11px; color:#92400E;">'+withName.toUpperCase()+' • CUSTOMER</b><p style="margin:4px 0 0; font-size:14px; line-height:1.4; color:#333;">'+m.text+'</p><p style="margin:6px 0 0; font-size:11px; text-align:right; color:#888;">'+m.time+'</p></div>';
  }).join('');
}
function pushMsg(m){
  const key='ziro_msgs_'+withName;
  const msgs=JSON.parse(localStorage.getItem(key)||'[]');
  msgs.push(m); localStorage.setItem(key, JSON.stringify(msgs)); renderMsgs(msgs); window.scrollTo(0, document.body.scrollHeight);
}
function sendMsg(){
  const inp=document.getElementById('msgInput');
  const t=inp.value.trim(); if(!t) return;
  const d=new Date();
  pushMsg({from:'me', text:t, time:d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')});
  inp.value='';
}
function toggleVoice(){
  const btn=document.getElementById('voiceBtn');
  if(!isRecording){
    isRecording=true; btn.textContent='⏹ Stop'; btn.style.background='#D32F2F'; btn.style.color='white';
    ziroNotify('Recording...','Tap Stop to send your voice message.<br>Voice stays inside ZIRO.','Stop & Send', function(){ toggleVoice(); });
  } else {
    isRecording=false; btn.textContent='🎤 Voice'; btn.style.background='#CCFBF1'; btn.style.color='#0B3D2E';
    const d=new Date();
    pushMsg({from:'me', voice:'0:08', time:d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')});
  }
}
function startCall(type){
  document.getElementById('callScreen').style.display='flex';
  document.getElementById('callAvatar').textContent=withName[0];
  document.getElementById('callName').textContent=withName+' • '+type+' Call';
  document.getElementById('callStatus').textContent= type==='Video' ? 'Video Calling... Camera on' : 'Calling...';
  callSecs=0; document.getElementById('callTimer').textContent='00:00';
  clearInterval(callTimerInt);
  callTimerInt=setInterval(()=>{
    callSecs++;
    const m=String(Math.floor(callSecs/60)).padStart(2,'0'), s=String(callSecs%60).padStart(2,'0');
    document.getElementById('callTimer').textContent=m+':'+s;
    if(callSecs===2) document.getElementById('callStatus').textContent='Connected • '+type+' Call Active';
  },1000);
}
function endCall(){
  clearInterval(callTimerInt);
  document.getElementById('callScreen').style.display='none';
  const d=new Date();
  pushMsg({from:'me', text:'📞 Call ended • '+document.getElementById('callTimer').textContent, time:d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')});
}
document.getElementById('msgInput').addEventListener('keypress', function(e){ if(e.key==='Enter') sendMsg(); });
document.addEventListener('DOMContentLoaded', loadChat);
</script>
</body>
</html>
