<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ZIRO - Chat</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body style="background:#0F766E; margin:0;">
<div style="background:#0B3D2E; padding:12px 14px; display:flex; align-items:center; gap:10px; color:white; position:sticky; top:0; z-index:10;">
  <span onclick="window.location.href='chat.html'" style="font-size:20px;">←</span>
  <div id="chatAvatar" style="width:40px; height:40px; min-width:40px; background:#F2C94C; color:#0B3D2E; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:900;">S</div>
  <div style="flex:1; min-width:0;">
    <b id="chatName" style="display:block; font-size:16px;">Segun O.</b>
    <span id="chatSkill" style="font-size:12px; color:#A7F3D0;">● Available • Barber</span>
  </div>
  <button style="background:rgba(255,255,255,0.15); color:white; border:none; padding:8px 12px; border-radius:999px; font-size:12px;">Call</button>
  <button style="background:#F2C94C; color:#0B3D2E; border:none; padding:8px 12px; border-radius:999px; font-size:12px; font-weight:800;">Video</button>
</div>
<div style="padding:10px 12px;">
  <div style="background:rgba(255,255,255,0.9); border-radius:12px; padding:10px 12px; display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
    <span style="font-size:13px;">📋 <b>Job:</b> <span id="jobLabel">Segun O. • Job</span></span>
    <button onclick="window.location.href='index.html'" style="background:#0B6E4F; color:white; border:none; padding:7px 12px; border-radius:999px; font-size:12px; font-weight:800;">View Job</button>
  </div>
  <p style="text-align:center; font-size:11px; color:#CCFBF1; background:rgba(0,0,0,0.2); padding:6px 10px; border-radius:999px; width:fit-content; margin:0 auto 12px;">ZIRO Secure • Today • Chat started</p>
  <div id="messages"></div>
</div>
<div style="position:fixed; bottom:0; left:0; right:0; background:white; padding:10px 12px; display:flex; gap:8px; align-items:center;">
  <button style="width:38px; height:38px; border-radius:50%; border:1px solid #ddd; background:white; font-size:18px;">+</button>
  <input id="msgInput" placeholder="Type message..." style="flex:1; padding:11px 14px; border:1px solid #ddd; border-radius:999px; font-size:14px;">
  <button style="background:#CCFBF1; border:none; padding:9px 12px; border-radius:999px; font-size:12px;">🎤 Voice</button>
  <button onclick="sendMsg()" style="background:#F2C94C; color:#0B3D2E; border:none; padding:11px 16px; border-radius:999px; font-size:13px; font-weight:900;">Send</button>
</div>
<div style="height:70px;"></div>
<script>
let WORKERS={
  'Segun O.': {skill:'Barber', price:3000},
  'Grace M.': {skill:'Cook / Chef', price:8500},
  'Yusuf A.': {skill:'Welder', price:11000},
  'Blessing I.': {skill:'Gardener', price:4500},
  'Musa A.': {skill:'Plumber', price:8000},
  'Udoka': {skill:'Brick Layer', price:12000},
  'Ada O.': {skill:'Cleaner', price:6000},
  'Tunde B.': {skill:'Electrician', price:10000},
};
let withName='Segun O.';
function loadChat(){
  withName = new URLSearchParams(location.search).get('with') || localStorage.getItem('ziro_chat_with') || 'Segun O.';
  const w = WORKERS[withName] || {skill:'Worker', price:5000};
  document.getElementById('chatAvatar').textContent = withName[0];
  document.getElementById('chatName').textContent = withName;
  document.getElementById('chatSkill').textContent = '● Available • '+w.skill+' • ₦'+w.price.toLocaleString();
  document.getElementById('jobLabel').textContent = withName+' • '+w.skill+' Job';
  // Save to chat list so this person appears in My Chat
  let chats = JSON.parse(localStorage.getItem('ziro_chats') || '[]');
  if(!chats.includes(withName)){ chats.unshift(withName); localStorage.setItem('ziro_chats', JSON.stringify(chats)); }
  const key='ziro_msgs_'+withName;
  let msgs = JSON.parse(localStorage.getItem(key) || 'null');
  if(!msgs){
    msgs=[
      {from:'other', text:'Hello, I can do this '+w.skill.toLowerCase()+' work. Are you in my area?', time:'12:19'},
      {from:'me', text:'Yes, I am around. How much for today?', time:'12:20'},
      {from:'other', text:'₦'+w.price.toLocaleString()+'. I can come by 2pm. Is that okay?', time:'12:21'},
    ];
    localStorage.setItem(key, JSON.stringify(msgs));
  }
  renderMsgs(msgs);
}
function renderMsgs(msgs){
  document.getElementById('messages').innerHTML = msgs.map(m=>{
    if(m.from==='me') return '<div style="background:#0B6E4F; color:white; padding:12px 14px; border-radius:16px 16px 4px 16px; max-width:80%; margin:0 0 10px auto;"><b style="font-size:11px; color:#F2C94C;">YOU • WORKER</b><p style="margin:4px 0 0; font-size:14px; line-height:1.4;">'+m.text+'</p><p style="margin:6px 0 0; font-size:11px; text-align:right; color:#A7F3D0;">'+m.time+' ✓✓</p></div>';
    return '<div style="background:#FEF3C7; padding:12px 14px; border-radius:16px 16px 16px 4px; max-width:80%; margin:0 0 10px;"><b style="font-size:11px; color:#92400E;">'+withName.toUpperCase()+' • CUSTOMER</b><p style="margin:4px 0 0; font-size:14px; line-height:1.4; color:#333;">'+m.text+'</p><p style="margin:6px 0 0; font-size:11px; text-align:right; color:#888;">'+m.time+'</p></div>';
  }).join('');
}
function sendMsg(){
  const inp=document.getElementById('msgInput');
  const t=inp.value.trim(); if(!t) return;
  const key='ziro_msgs_'+withName;
  const msgs=JSON.parse(localStorage.getItem(key)||'[]');
  const d=new Date();
  msgs.push({from:'me', text:t, time:d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')});
  localStorage.setItem(key, JSON.stringify(msgs));
  inp.value=''; renderMsgs(msgs); window.scrollTo(0, document.body.scrollHeight);
}
document.getElementById('msgInput').addEventListener('keypress', function(e){ if(e.key==='Enter') sendMsg(); });
document.addEventListener('DOMContentLoaded', loadChat);
</script>
</body>
</html>
