<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ZIRO - Home</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body style="background:#0B3D2E; margin:0; padding-bottom:75px;">
<div style="background:linear-gradient(180deg,#0B6E4F 0%, #0B3D2E 100%); padding:18px 16px 20px; border-radius:0 0 22px 22px; color:white;">
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <div style="background:white; color:#0B3D2E; padding:6px 12px; border-radius:10px; font-weight:900; font-size:18px;">ZIRO <span style="color:#F2C94C;">●</span></div>
    <span onclick="window.location.href='office.html'" style="background:rgba(255,255,255,0.2); width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px;">👤</span>
  </div>
  <h2 style="margin:14px 0 4px; color:white;">Find Workers Near You</h2>
  <p style="margin:0; color:#F2C94C; font-size:13px;">Plumber • Electrician • Cleaner • Brick Layer</p>
  <input onclick="window.location.href='search.html'" readonly placeholder="🔍 Search worker, skill, area... Tap to Search" style="width:100%; box-sizing:border-box; padding:12px 14px; border-radius:999px; border:none; margin-top:14px; font-size:14px; background:white;">
  <div style="display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;">
    <button onclick="window.location.href='search.html?skill=All'" style="background:#F2C94C; color:#0B3D2E; border:none; padding:8px 14px; border-radius:999px; font-size:12px; font-weight:800;">All</button>
    <button onclick="window.location.href='search.html?skill=Plumber'" style="background:rgba(255,255,255,0.2); color:white; border:1px solid rgba(255,255,255,0.3); padding:8px 14px; border-radius:999px; font-size:12px; font-weight:700;">Plumber</button>
    <button onclick="window.location.href='search.html?skill=Electrician'" style="background:rgba(255,255,255,0.2); color:white; border:1px solid rgba(255,255,255,0.3); padding:8px 14px; border-radius:999px; font-size:12px; font-weight:700;">Electrician</button>
    <button onclick="window.location.href='search.html?skill=Cleaner'" style="background:rgba(255,255,255,0.2); color:white; border:1px solid rgba(255,255,255,0.3); padding:8px 14px; border-radius:999px; font-size:12px; font-weight:700;">Cleaner</button>
    <button onclick="window.location.href='search.html?skill=Brick Layer'" style="background:rgba(255,255,255,0.2); color:white; border:1px solid rgba(255,255,255,0.3); padding:8px 14px; border-radius:999px; font-size:12px; font-weight:700;">Brick Layer</button>
  </div>
</div>
<div style="background:#0B3D2E; padding:14px 16px 0;">
  <h3 style="margin:0 0 10px; color:white;">👷 Available Workers</h3>
  <p style="color:#B8D8CC; font-size:12px; margin:0 0 10px;">Tap any worker to view profile →</p>
  <div id="workerList"></div>
</div>
<div style="background:#0B3D2E; padding:6px 16px 20px;">
  <h3 style="margin:14px 0 10px; color:white;">📋 Recent Jobs</h3><div id="jobList"></div>
  <button onclick="window.location.href='post.html'" style="width:100%; background:#F2C94C; color:#0B3D2E; border:none; padding:14px; border-radius:12px; font-size:14px; font-weight:800; margin-top:10px;">+ Post a Job</button>
  <button onclick="window.location.href='sos.html'" style="width:100%; background:#D32F2F; color:white; border:none; padding:14px; border-radius:12px; font-size:14px; font-weight:800; margin-top:10px;">! SOS • Emergency</button>
  <p style="text-align:center; font-size:12px; color:#B8D8CC; margin:12px 0 0;">ZIRO does NOT hold job money. You pay workers directly.</p>
</div>
<div class="ziro-nav">
  <button class="ziro-nav-item active" onclick="window.location.href='index.html'"><span class="nav-icon">🏠</span>Home</button>
  <button class="ziro-nav-item" onclick="window.location.href='search.html'"><span class="nav-icon">🔍</span>Search</button>
  <button class="ziro-nav-center" onclick="window.location.href='post.html'">+</button>
  <button class="ziro-nav-item" onclick="window.location.href='chat.html'"><span class="nav-icon">💬</span>Chat</button>
  <button class="ziro-nav-item" onclick="window.location.href='office.html'"><span class="nav-icon">👤</span>My Office</button>
</div>
<script src="js/notify.js"></script>
<script src="js/wallet.js"></script>
<script>
function makeStableId(j){ const s=(j.skill||'')+'|'+(j.desc||'')+'|'+(j.budget||'')+'|'+(j.city||'')+'|'+(j.name||''); let h=0; for(let i=0;i<s.length;i++){ h=(h*31 + s.charCodeAt(i)) >>> 0; } return 'job_'+h; }
function goToJobDetails(job){ window.location.href='job.html?id='+makeStableId(job); }
function openWorker(name){ localStorage.setItem('ziro_view_worker', name); window.location.href='worker.html?name='+encodeURIComponent(name); }
function openChatWith(name){ localStorage.setItem('ziro_chat_with', name); window.location.href='chat-room.html?with='+encodeURIComponent(name); }
let WORKERS=[
  {name:'Segun O.', skill:'Barber', city:'Enugu', rating:'4.8', price:3000},
  {name:'Grace M.', skill:'Cook / Chef', city:'Wuse, Abuja', rating:'4.9', price:8500},
  {name:'Yusuf A.', skill:'Welder', city:'Kaduna', rating:'4.6', price:11000},
  {name:'Blessing I.', skill:'Gardener', city:'Lekki, Lagos', rating:'4.7', price:4500},
  {name:'Musa A.', skill:'Plumber', city:'Wuse 2, Abuja', rating:'4.8', price:8000},
  {name:'Udoka', skill:'Brick Layer', city:'Apo, Abuja', rating:'4.7', price:12000},
];
function renderWorkers(){
  document.getElementById('workerList').innerHTML=WORKERS.map(w=>'<div style="background:white; border-radius:16px; padding:16px; margin-bottom:12px;">'
    + '<div onclick="openWorker(\''+w.name+'\')" style="cursor:pointer;"><b style="font-size:16px;">'+w.name+' ✓ Verified <span style="color:#0B6E4F; font-size:12px;">View Profile ›</span></b><p style="margin:4px 0; font-size:13px; color:#666;">'+w.skill+' • '+w.city+'</p><p style="margin:4px 0; font-size:13px;">⭐ '+w.rating+' • Available Now • ₦'+w.price.toLocaleString()+' / job</p></div>'
    + '<div style="background:#F2F4F2; border-radius:12px; padding:10px; margin-top:10px; display:flex; flex-direction:column; gap:8px;">'
    + '<button onclick="hireWorker(\''+w.name+'\')" style="width:100%; background:#0B6E4F; color:white; border:none; padding:13px; border-radius:10px; font-size:14px; font-weight:800;">Hire Now</button>'
    + '<div style="display:flex; gap:8px;"><button onclick="unlockContact(\''+w.name+'\')" style="flex:1; background:white; color:#0B3D2E; border:1px solid #ddd; padding:11px 6px; border-radius:10px; font-size:12px; font-weight:800;">🔓 Unlock • 5 iCoin</button><button onclick="openWorker(\''+w.name+'\')" style="flex:1; background:white; color:#0B6E4F; border:1px solid #0B6E4F; padding:11px 6px; border-radius:10px; font-size:12px; font-weight:800;">👤 View Profile</button></div>'
    + '</div>'
    + '</div>').join('');
}
function hireWorker(name){ ziroConfirm('Hire '+name+'?', 'Chat with '+name+' to agree time and price.', function(){ openChatWith(name); }); }
// FIXED: Unlock now deducts 5 iCoin AND Go to Chat really opens chat
function unlockContact(name){
  if(localStorage.getItem('ziro_unlocked_'+name)==='yes'){
    ziroNotify('Already Unlocked', 'You already unlocked '+name+'.', 'Go to Chat', function(){ openChatWith(name); });
    return;
  }
  ziroConfirm('Unlock Contact?', 'Unlock '+name+' contact for 5 iCoin?', function(){
    if(typeof ziroSpendIcoin === 'function'){
      const ok = ziroSpendIcoin(5, 'Unlocked '+name+' • -5 iCoin');
      if(!ok){ ziroNotify('Not Enough iCoin', 'You need 5 iCoin to unlock.<br>Buy iCoin in Wallet.', 'Go to Wallet', function(){ window.location.href='wallet.html'; }); return; }
    }
    localStorage.setItem('ziro_unlocked_'+name, 'yes');
    ziroNotify('Contact Unlocked', 'You can now chat with '+name+'.<br>5 iCoin used.', 'Go to Chat', function(){ openChatWith(name); });
  });
}
function renderJobs(){
  const list=document.getElementById('jobList'); let jobs=JSON.parse(localStorage.getItem('ziro_jobs')||'[]');
  if(!jobs.length){ jobs=[{skill:'Brick Layer', desc:'Mend my fence', city:'Apo NEPA, Fct Abuja', budget:12000, name:'Udoka/0814638963'}]; localStorage.setItem('ziro_jobs', JSON.stringify(jobs)); }
  list.innerHTML=jobs.slice().reverse().map((j)=>{ const sid=makeStableId(j); const accepted=localStorage.getItem('ziro_accepted_'+sid)==='yes'; return '<div style="background:white; border-radius:16px; padding:16px; margin-bottom:12px;"><div style="display:flex; justify-content:space-between; align-items:center; gap:8px;"><b style="font-size:15px;">'+j.skill+' needed</b><span style="background:#FFF8E1; border:1px solid #F2C94C; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700;">'+(accepted?'✓ ACCEPTED':'OPEN')+'</span></div><p style="margin:6px 0; font-size:13px; color:#555;">'+j.desc+'</p><p style="margin:4px 0; font-size:13px;">📍 '+j.city+' • 💰 ₦'+Number(j.budget).toLocaleString()+'</p><button onclick=\'goToJobDetails('+JSON.stringify(j).replace(/'/g,"&#39;")+')\' style="width:100%; background:#0B6E4F; color:white; border:none; padding:13px; border-radius:12px; font-size:14px; font-weight:800; margin-top:8px;">'+(accepted?'View Job Details • Accepted':'View Job Details')+'</button></div>'; }).join('');
}
document.addEventListener('DOMContentLoaded', ()=>{ renderWorkers(); renderJobs(); });
</script>
</body>
</html>
