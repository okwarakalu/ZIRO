<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ZIRO - Find Workers Near You</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body style="padding-bottom:75px;">
<div style="background:linear-gradient(180deg,#0B6E4F 0%, #0B3D2E 100%); padding:18px 16px 20px; border-radius:0 0 22px 22px; color:white;">
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <div style="background:white; color:#0B3D2E; padding:6px 12px; border-radius:10px; font-weight:900; font-size:18px;">ZIRO <span style="color:#F2C94C;">●</span></div>
    <span onclick="window.location.href='office.html'" style="background:rgba(255,255,255,0.2); width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px;">👤</span>
  </div>
  <h2 style="margin:14px 0 4px; color:white;">Find Workers Near You</h2>
  <p style="margin:0; color:#F2C94C; font-size:13px;">Plumber • Electrician • Cleaner • Brick Layer</p>
  <input id="homeSearch" placeholder="🔍 Search worker, skill, area..." oninput="filterHome(this.value)" style="width:100%; box-sizing:border-box; padding:12px 14px; border-radius:999px; border:none; margin-top:14px; font-size:14px;">
  <div style="display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;">
    <button onclick="filterBySkill('All')" style="background:#F2C94C; color:#0B3D2E; border:none; padding:8px 14px; border-radius:999px; font-size:12px; font-weight:800;">All</button>
    <button onclick="filterBySkill('Plumber')" style="background:rgba(255,255,255,0.2); color:white; border:1px solid rgba(255,255,255,0.3); padding:8px 14px; border-radius:999px; font-size:12px; font-weight:700;">Plumber</button>
    <button onclick="filterBySkill('Electrician')" style="background:rgba(255,255,255,0.2); color:white; border:1px solid rgba(255,255,255,0.3); padding:8px 14px; border-radius:999px; font-size:12px; font-weight:700;">Electrician</button>
    <button onclick="filterBySkill('Cleaner')" style="background:rgba(255,255,255,0.2); color:white; border:1px solid rgba(255,255,255,0.3); padding:8px 14px; border-radius:999px; font-size:12px; font-weight:700;">Cleaner</button>
    <button onclick="filterBySkill('Brick Layer')" style="background:rgba(255,255,255,0.2); color:white; border:1px solid rgba(255,255,255,0.3); padding:8px 14px; border-radius:999px; font-size:12px; font-weight:700;">Brick Layer</button>
  </div>
</div>
<div style="padding:14px 16px 0;"><h3 style="margin:0 0 10px;">👷 Available Workers</h3><div id="workerList"></div></div>
<div style="padding:6px 16px 0;">
  <h3 style="margin:14px 0 10px;">📋 Recent Jobs</h3><div id="jobList"></div>
  <button onclick="window.location.href='post.html'" style="width:100%; background:#0B6E4F; color:white; border:none; padding:14px; border-radius:12px; font-size:14px; font-weight:800; margin-top:10px;">+ Post a Job</button>
  <button onclick="window.location.href='sos.html'" style="width:100%; background:#D32F2F; color:white; border:none; padding:14px; border-radius:12px; font-size:14px; font-weight:800; margin-top:10px;">! SOS • Emergency</button>
  <p style="text-align:center; font-size:12px; color:#888; margin:12px 0 0;">ZIRO does NOT hold job money. You pay workers directly.<br>Terms • Privacy • iCoin Policy • Refund Policy</p>
</div>
<div class="ziro-nav">
  <button class="ziro-nav-item active" onclick="window.location.href='index.html'"><span class="nav-icon">🏠</span>Home</button>
  <button class="ziro-nav-item" onclick="document.getElementById('homeSearch').focus()"><span class="nav-icon">🔍</span>Search</button>
  <button class="ziro-nav-center" onclick="window.location.href='post.html'">+</button>
  <button class="ziro-nav-item" onclick="window.location.href='chat.html'"><span class="nav-icon">💬</span>Chat</button>
  <button class="ziro-nav-item" onclick="window.location.href='office.html'"><span class="nav-icon">👤</span>My Office</button>
</div>
<script src="js/notify.js"></script>
<script>
function makeStableId(j){ const s=(j.skill||'')+'|'+(j.desc||'')+'|'+(j.budget||'')+'|'+(j.city||'')+'|'+(j.name||''); let h=0; for(let i=0;i<s.length;i++){ h=(h*31 + s.charCodeAt(i)) >>> 0; } return 'job_'+h; }
function goToJobDetails(job){ window.location.href='job.html?id='+makeStableId(job); }
let WORKERS=[
  {name:'Segun O.', skill:'Barber', city:'Enugu', rating:'4.8', price:3000, color:'#0B6E4F'},
  {name:'Grace M.', skill:'Cook / Chef', city:'Wuse, Abuja', rating:'4.9', price:8500, color:'#E67E22'},
  {name:'Yusuf A.', skill:'Welder', city:'Kaduna', rating:'4.6', price:11000, color:'#2980B9'},
  {name:'Blessing I.', skill:'Gardener', city:'Lekki, Lagos', rating:'4.7', price:4500, color:'#8E44AD'},
  {name:'Musa A.', skill:'Plumber', city:'Wuse 2, Abuja', rating:'4.8', price:8000, color:'#0B6E4F'},
  {name:'Udoka', skill:'Brick Layer', city:'Apo, Abuja', rating:'4.7', price:12000, color:'#E67E22'},
];
let currentFilter='All', currentSearch='';
function renderWorkers(){
  const list=document.getElementById('workerList');
  const rows=WORKERS.filter(w=>{ const okSkill=currentFilter==='All'||w.skill.toLowerCase().includes(currentFilter.toLowerCase()); const q=currentSearch.toLowerCase(); const okSearch=!q||w.name.toLowerCase().includes(q)||w.skill.toLowerCase().includes(q)||w.city.toLowerCase().includes(q); return okSkill&&okSearch; });
  if(!rows.length){ list.innerHTML='<p style="background:white; padding:16px; border-radius:14px; text-align:center; color:#888;">No workers found.</p>'; return; }
  list.innerHTML=rows.map(w=>'<div style="background:white; border-radius:16px; padding:16px; margin-bottom:12px; box-shadow:0 1px 4px rgba(0,0,0,0.06);"><b style="font-size:16px;">'+w.name+' ✓ Verified</b><p style="margin:4px 0; font-size:13px; color:#666;">'+w.skill+' • '+w.city+'</p><p style="margin:4px 0; font-size:13px;">⭐ '+w.rating+' • Available Now • ₦'+w.price.toLocaleString()+' / job</p><button onclick="hireWorker(\''+w.name+'\',\''+w.skill+'\','+w.price+')" style="width:100%; background:#0B6E4F; color:white; border:none; padding:13px; border-radius:12px; font-size:14px; font-weight:800; margin-top:8px;">Hire Now</button><button onclick="unlockContact(\''+w.name+'\')" style="width:100%; background:white; color:#0B3D2E; border:1px solid #ddd; padding:12px; border-radius:12px; font-size:13px; font-weight:700; margin-top:8px;">Unlock Contact • 5 iCoin</button></div>').join('');
}
function filterHome(v){ currentSearch=v; renderWorkers(); }
function filterBySkill(s){ currentFilter=s; renderWorkers(); }
function hireWorker(name,skill,price){ ziroConfirm('Hire '+name+'?', skill+' • ₦'+Number(price).toLocaleString()+'<br><br>Chat with '+name+' to agree time and price.', function(){ localStorage.setItem('ziro_chat_with', name); window.location.href='chat-room.html?with='+encodeURIComponent(name); }); }
function unlockContact(name){ ziroConfirm('Unlock Contact?', 'Unlock '+name+' contact for 5 iCoin?', function(){ ziroNotify('Contact Unlocked', 'You can now chat with '+name+'.', 'Go to Chat'); const b=document.querySelector('#ziroModal button'); if(b) b.onclick=function(){ closeZiroModal(); localStorage.setItem('ziro_chat_with', name); window.location.href='chat-room.html?with='+encodeURIComponent(name); }; }); }
function renderJobs(){
  const list=document.getElementById('jobList'); let jobs=JSON.parse(localStorage.getItem('ziro_jobs')||'[]');
  if(!jobs.length){ jobs=[{skill:'Brick Layer', desc:'Mend my fence', city:'Apo NEPA, Fct Abuja', budget:12000, name:'Udoka/0814638963'}]; localStorage.setItem('ziro_jobs', JSON.stringify(jobs)); }
  list.innerHTML=jobs.slice().reverse().map((j)=>{ const sid=makeStableId(j); const accepted=localStorage.getItem('ziro_accepted_'+sid)==='yes'; return '<div style="background:white; border-radius:16px; padding:16px; margin-bottom:12px; box-shadow:0 1px 4px rgba(0,0,0,0.06);"><div style="display:flex; justify-content:space-between; align-items:center; gap:8px;"><b style="font-size:15px;">'+j.skill+' needed</b><span style="background:#FFF8E1; border:1px solid #F2C94C; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700;">'+(accepted?'✓ ACCEPTED':'OPEN')+'</span></div><p style="margin:6px 0; font-size:13px; color:#555; word-break:break-word;">'+j.desc+'</p><p style="margin:4px 0; font-size:13px;">📍 '+j.city+' • 💰 ₦'+Number(j.budget).toLocaleString()+'</p><button onclick=\'goToJobDetails('+JSON.stringify(j).replace(/'/g,"&#39;")+')\' style="width:100%; background:#0B6E4F; color:white; border:none; padding:13px; border-radius:12px; font-size:14px; font-weight:800; margin-top:8px;">'+(accepted?'View Job Details • Accepted':'View Job Details')+'</button></div>'; }).join('');
}
document.addEventListener('DOMContentLoaded', ()=>{ renderWorkers(); renderJobs(); });
</script>
</body>
</html>
