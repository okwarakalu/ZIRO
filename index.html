<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZIRO - Work. Hustle. Get Paid.</title>
<meta name="description" content="Find Trusted Workers Near You, Fast. Nigeria - 36 States + FCT. No Escrow.">
<meta name="theme-color" content="#0A3D2A">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/wallet.css">
<link rel="stylesheet" href="css/office.css">
</head>
<body>

<!-- HEADER - LOCKED: Forest Green, SOS INLINE ONLY -->
<header class="top">
  <div class="logo"><b>Z</b> ZIRO</div>
  <div class="search">
    <input id="globalSearch" placeholder="Search Plumber, Driver, Cleaner...">
    <button onclick="ZIRO.go('search')">🔍</button>
  </div>
  <button class="icoin" onclick="ZIRO.go('wallet')">🪙 <span data-bal>120</span> iCoin</button>
  <button class="sos-inline" onclick="ZIRO.sos()">SOS</button>
  <button class="avatar" onclick="ZIRO.go('office')">A</button>
</header>

<!-- PAGES LOAD HERE - From /pages/ folder -->
<main id="app">
  <div id="p-home" class="page on">
    <p style="text-align:center;padding:30px">Loading ZIRO...</p>
  </div>
  <div id="p-search" class="page"></div>
  <div id="p-post" class="page"></div>
  <div id="p-wallet" class="page"></div>
  <div id="p-office" class="page"></div>
  <div id="p-chat" class="page"></div>
</main>

<!-- BOTTOM NAV - LOCKED -->
<nav class="bottom">
  <button onclick="ZIRO.go('home')">🏠<br>Home</button>
  <button onclick="ZIRO.go('search')">🔍<br>Search</button>
  <button onclick="ZIRO.go('post')" class="plus">+</button>
  <button onclick="ZIRO.go('chat')">💬<br>Chat</button>
  <button onclick="ZIRO.go('office')">👤<br>My Office</button>
</nav>

<!-- ONLY FLOATING BUTTON IN WHOLE APP - CHIOMA -->
<button id="chiomaFloat" onclick="ZIRO.chioma()">C</button>

<!-- MODULAR JS - ORDER MATTERS, DO NOT REORDER -->
<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/wallet.js"></script>
<script src="js/jobs.js"></script>
<script src="js/chat.js"></script>
<script src="js/sos.js"></script>
<script src="js/chioma.js"></script>
<script src="js/admin.js"></script>
<script>
  // Register PWA Service Worker for App conversion later
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
  // Load pages on start
  window.addEventListener('DOMContentLoaded', ()=> ZIRO.init());
</script>
</body>
</html>
