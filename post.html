<!-- ZIRO POST - Post Job only - NOT FREE - Pay iCoin -->
<h2>What do you need?</h2>
<p>Post in 30 seconds. Workers near you will see it.</p>
<input id="jobTitle" placeholder="e.g. I need a Barber">
<select id="jobCat"><option>Barber</option><option>Plumber</option><option>Electrician</option><option>Cleaner</option><option>Driver</option></select>
<input id="jobLoc" placeholder="e.g. Wuse 2, Abuja">
<input id="jobPrice" type="number" placeholder="Budget (₦) e.g. 5000">
<textarea id="jobDesc" placeholder="Describe the job..."></textarea>
<button class="btn-green" onclick="ZIRO.postJob()">Post Job — Pay 10 iCoin</button>
<p style="font-size:12px;color:#666">You pay iCoin to post. You pay Worker DIRECTLY after work. ZIRO does not hold money.</p>
