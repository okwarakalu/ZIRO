<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ZIRO - Search</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body style="background:#0A2540; margin:0;">
<div style="background:linear-gradient(180deg,#123A6D 0%, #0A2540 100%); padding:20px 16px; border-radius:0 0 22px 22px; color:white;">
  <div onclick="window.location.href='index.html'" style="font-size:14px;">← Back to Home</div>
  <h2 style="margin:12px 0 4px; color:white;">🔍 Search ZIRO</h2>
  <p style="margin:0; color:#8EC8FF; font-size:13px;">Find any worker, skill or area fast</p>
  <input id="searchInput" placeholder="🔍 Type Plumber, Cleaner, Wuse..." oninput="doSearch(this.value)" style="width:100%; box-sizing:border-box; padding:14px; border-radius:999px; border:none; margin-top:14px; font-size:15px;">
  <div style="display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;">
    <button onclick="setSkill('All')" style="background:white; color:#0A2540; border:none; padding:9px 14px; border-radius:999px; font-size:12px; font-weight:800;">All</button>
    <button onclick="setSkill('Plumber')" style="background:rgba(255,255,255,0.15); color:white; border:1px solid rgba(255,255,255,0.3); padding:9px 14px; border-radius:999px; font-size:12px; font-weight:700;">Plumber</button>
    <button onclick="setSkill('Electrician')" style="background:rgba(255,255,255,0.15); color:white; border:1px solid rgba(255,255,255,0.3); padding:9px 14px; border-radius:999px; font-size:12px; font-weight:700;">Electrician</button>
    <button onclick="setSkill('Cleaner')" style="background:rgba(255,255,255,0.15); color:white; border:1px solid rgba(255,255,255,0.3); padding:9px 14px; border-radius:999px; font-size:12px; font-weight:700;">Cleaner</button>
    <button onclick="setSkill('Brick Layer')" style="background:rgba(255,255,255,0.15); color:white; border:1px solid rgba(255,255,255,0.3); padding:9px 14px; border-radius:999px; font-size:12px; font-weight:700;">Brick Layer</button>
  </div>
  <div style="display:flex; gap:8px; margin-top:12px;">
    <button onclick="setArea('All')" style="background:#F2C94C; color:#0A2540; border:none; padding:8px 12px; border-radius:999px; font-size:11px; font-weight:800;">📍 All Areas</button>
    <button onclick="setArea('Abuja')" style="background:rgba(255,255,255,0.15); color:white; border:1px solid rgba(255,255,255,0.3); padding:8px 12px; border-radius:999px; font-size:11px;">Abuja</button>
    <button onclick="setArea('Lagos')" style="background:rgba(255,255,255,0.15); color:white; border:1px solid rgba(255,255,255,0.3); padding:8px 12px; border-radius:999px; font-size:11px;">Lagos</button>
    <button onclick="setArea('Enugu')" style="background:rgba(255,255,255,0.15); color:white; border:1px solid rgba(255,255,255,0.3); padding:8px 12px; border-radius:999px; font-size:11px;">Enugu</button>
  </div>
</div>
<div style="background:#0A2540; padding:14px 16px;">
  <p id="resultCount" style="color:#8EC8FF; font-size:13px; margin:0 0 10px;">Showing all workers</p>
  <div id="results"></div>
</div>
<script src="js/notify.js"></script>
<script>
let WORKERS=[
  {name:'Segun O.', skill:'Barber', city:'Enugu', rating:'4.8', price:3000},
  {name:'Grace M.', skill:'Cook / Chef', city:'Wuse, Abuja', rating:'4.9', price:8500},
  {name:'Yusuf A.', skill:'Welder', city:'Kaduna', rating:'4.6', price:11000},
  {name:'Blessing I.', skill:'Gardener', city:'Lekki, Lagos', rating:'4.7', price:4500},
  {name:'Musa A.', skill:'Plumber', city:'Wuse 2, Abuja', rating:'4.8', price:8000},
  {name:'Udoka', skill:'Brick Layer', city:'Apo, Abuja', rating:'4.7', price:12000},
  {name:'Ada O.', skill:'Cleaner', city:'Garki, Abuja', rating:'4.8', price:6000},
  {name:'Tunde B.', skill:'Electrician', city:'Garki, Abuja', rating:'4.7', price:10000},
];
let q='', skillFilter='All', areaFilter='All';
function setSkill(s){ skillFilter=s; renderSearch(); }
function setArea(a){ areaFilter=a; renderSearch(); }
function doSearch(v){ q=v; renderSearch(); }
function openWorker(name){ localStorage.setItem('ziro_view_worker', name); window.location.href='worker.html?name='+encodeURIComponent(name); }
function renderSearch(){
  const rows=WORKERS.filter(w=>{ const okQ=!q || (w.name+w.skill+w.city).toLowerCase().includes(q.toLowerCase()); const okS=skillFilter==='All' || w.skill.toLowerCase().includes(skillFilter.toLowerCase()); const okA=areaFilter==='All' || w.city.toLowerCase().includes(areaFilter.toLowerCase()); return okQ && okS && okA; });
  document.getElementById('resultCount').textContent = rows.length + ' worker(s) found' + (skillFilter!=='All' ? ' • '+skillFilter : '') + (areaFilter!=='All' ? ' • '+areaFilter : '');
  document.getElementById('results').innerHTML = rows.length ? rows.map(w=>'<div style="background:white; border-radius:16px; padding:16px; margin-bottom:12px;">'
    + '<div onclick="openWorker(\''+w.name+'\')" style="cursor:pointer;"><b style="font-size:16px;">'+w.name+' ✓ Verified <span style="color:#123A6D; font-size:12px;">View Profile ›</span></b><p style="margin:4px 0; font-size:13px; color:#666;">'+w.skill+' • '+w.city+'</p><p style="margin:4px 0; font-size:13px;">⭐ '+w.rating+' • Available Now • ₦'+w.price.toLocaleString()+' / job</p></div>'
    + '<div style="background:#F2F4F2; border-radius:12px; padding:10px; margin-top:10px; display:flex; flex-direction:column; gap:8px;"><button onclick="hireWorker(\''+w.name+'\')" style="width:100%; background:#123A6D; color:white; border:none; padding:13px; border-radius:10px; font-size:14px; font-weight:800;">Hire Now</button><div style="display:flex; gap:8px;"><button onclick="unlockWorker(\''+w.name+'\')" style="flex:1; background:white; border:1px solid #ddd; padding:11px 6px; border-radius:10px; font-size:12px; font-weight:800;">🔓 Unlock • 5 iCoin</button><button onclick="openWorker(\''+w.name+'\')" style="flex:1; background:white; color:#123A6D; border:1px solid #123A6D; padding:11px 6px; border-radius:10px; font-size:12px; font-weight:800;">👤 View Profile</button></div></div>'
    + '</div>').join('') : '<p style="background:white; padding:20px; border-radius:14px; text-align:center; color:#666;">No worker found.</p>';
}
function hireWorker(name){ localStorage.setItem('ziro_chat_with', name); window.location.href='chat-room.html?with='+encodeURIComponent(name); }
function unlockWorker(name){ ziroConfirm('Unlock Contact?', 'Unlock '+name+' for 5 iCoin?', function(){ ziroNotify('Contact Unlocked','You can now chat with '+name+'.'); }); }
document.addEventListener('DOMContentLoaded', ()=>{ const s=new URLSearchParams(location.search).get('skill'); if(s && s!=='All') skillFilter=s; renderSearch(); });
</script>
</body>
</html>
