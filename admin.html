<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>ZIRO - Admin Hub</title></head>
<body style="background:#111; margin:0; font-family:sans-serif;">
<div style="background:#0B3D2E; padding:20px 16px; color:white;"><div onclick="window.location.href='office.html'">← Back to My Office</div><h2 style="margin:12px 0 4px;">🛠 ZIRO Admin Hub</h2><p style="margin:0; color:#F2C94C; font-size:13px;">7 Departments • CEO Sees All • GM Sees All Except CEO</p></div>
<div style="padding:16px;">
<div style="background:white; border-radius:16px; padding:18px;"><b>Live Price:</b> <span id="livePrice">₦50</span> • GM: <b id="gmPrice">₦50</b> • CEO Override: <b id="ceoPrice">None</b><p style="font-size:12px; color:#666; margin:6px 0 0;">CEO price overrides GM. GM monitors 5 depts. CEO monitors all.</p></div>
<div style="background:white; border-radius:16px; padding:18px; margin-top:12px;"><b>Top Management</b>
<button onclick="enterAdmin('ceo')" style="width:100%; background:#111; color:#F2C94C; border:2px solid #F2C94C; padding:16px; border-radius:12px; font-size:15px; font-weight:900; margin-top:10px;">👑 CEO Dashboard<br><span style="font-size:12px; color:white; font-weight:400;">ALL + Override GM + Control ALL Depts</span></button>
<button onclick="enterAdmin('gm')" style="width:100%; background:#0B6E4F; color:white; border:none; padding:16px; border-radius:12px; font-size:15px; font-weight:900; margin-top:10px;">👔 GM Dashboard<br><span style="font-size:12px; font-weight:400;">Day-to-Day • Price • Monitors 5 Depts (Not CEO)</span></button></div>
<div style="background:white; border-radius:16px; padding:18px; margin-top:12px;"><b>Other 5 Departments</b>
<button onclick="goDept('support','support.html')" style="width:100%; background:#F2F4F2; border:none; padding:13px; border-radius:10px; font-weight:800; margin-top:8px; text-align:left;">💬 Customer Support →</button>
<button onclick="goDept('finance','finance.html')" style="width:100%; background:#F2F4F2; border:none; padding:13px; border-radius:10px; font-weight:800; margin-top:8px; text-align:left;">💰 Finance / Payments →</button>
<button onclick="goDept('verification','verification.html')" style="width:100%; background:#F2F4F2; border:none; padding:13px; border-radius:10px; font-weight:800; margin-top:8px; text-align:left;">✅ Verification / Trust →</button>
<button onclick="goDept('moderation','moderation.html')" style="width:100%; background:#F2F4F2; border:none; padding:13px; border-radius:10px; font-weight:800; margin-top:8px; text-align:left;">🛡 Moderation / Safety →</button>
<button onclick="goDept('marketing','marketing.html')" style="width:100%; background:#F2F4F2; border:none; padding:13px; border-radius:10px; font-weight:800; margin-top:8px; text-align:left;">📣 Marketing / Growth →</button></div>
</div>
<script src="js/wallet.js"></script><script src="js/admin.js"></script>
<script>
function enterAdmin(r){ ziroSetAdminRole(r); window.location.href=r==='ceo'?'ceo.html':'gm.html'; }
function goDept(dept, file){ localStorage.setItem('ziro_admin_role', dept); localStorage.setItem('ziro_current_dept', dept); window.location.href=file; }
document.addEventListener('DOMContentLoaded', ()=>{ document.getElementById('livePrice').textContent='₦'+ziroGetCoinPrice(); document.getElementById('gmPrice').textContent='₦'+ziroGetGMPrice(); const c=ziroGetCEOPrice(); document.getElementById('ceoPrice').textContent=c===null?'None - GM active':'₦'+c+' OVERRIDING'; });
</script></body></html>
