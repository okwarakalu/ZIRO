<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>ZIRO - Verification</title></head>
<body style="background:#2E1065; margin:0; font-family:sans-serif;">
<div style="background:#2E1065; padding:20px 16px; color:white;"><div onclick="window.location.href='admin.html'">← Admin Hub</div><h2 style="margin:12px 0 4px;">✅ Verification / Trust</h2><p style="margin:0; color:#DDD6FE; font-size:13px;">Verify Workers • ID • Ratings — Monitored by GM + CEO</p></div>
<div style="padding:16px;"><div style="background:white; border-radius:16px; padding:18px;"><b>Duties</b><p style="font-size:13px; color:#555; line-height:1.7;">- Verify worker name, skill, area, ID<br>- Give ✓ Verified badge<br>- Remove fake / duplicate profiles<br>- Check ratings & reviews are real</p></div>
<div style="background:white; border-radius:16px; padding:18px; margin-top:12px;"><b>Tasks</b><div style="display:flex; gap:8px; margin-top:10px;"><input id="taskInput" placeholder="Add verification task..." style="flex:1; padding:12px; border:1px solid #ddd; border-radius:12px;"><button onclick="addTask()" style="background:#6D28D9; color:white; border:none; padding:12px 16px; border-radius:12px; font-weight:900;">Add</button></div><div id="taskList"></div></div></div>
<script src="js/notify.js"></script><script src="js/wallet.js"></script><script src="js/admin.js"></script>
<script>
function render(){ const t=ziroGetDeptTasks('verification'); document.getElementById('taskList').innerHTML=t.length?t.map((x,i)=>'<p style="font-size:13px; margin:10px 0 0;"><input type="checkbox" '+(x.done?'checked':'')+' onclick="ziroToggleDeptTask(\'verification\','+i+');render();"> <span style="'+(x.done?'text-decoration:line-through;color:#888;':'')+'">'+x.text+'</span> • '+x.time+'</p>').join(''):'<p style="font-size:13px; color:#888;">No tasks yet.</p>'; }
function addTask(){ const v=document.getElementById('taskInput').value.trim(); if(!v) return; ziroAddDeptTask('verification', v); document.getElementById('taskInput').value=''; render(); }
document.addEventListener('DOMContentLoaded', ()=>{ localStorage.setItem('ziro_admin_role','verification'); render(); });
</script></body></html>
