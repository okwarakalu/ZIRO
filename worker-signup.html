<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ZIRO - Join as Worker</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body style="background:#0B3D2E; margin:0;">
<div style="background:linear-gradient(180deg,#0B6E4F 0%, #0B3D2E 100%); padding:20px 16px; border-radius:0 0 22px 22px; color:white;">
  <div onclick="window.location.href='index.html'" style="font-size:14px;">← Back to Home</div>
  <h2 style="margin:12px 0 4px; color:white;">👷 Join as Worker</h2>
  <p style="margin:0; color:#F2C94C; font-size:13px;">Get jobs near you. Chat on ZIRO. Get paid directly.</p>
</div>
<div style="background:#0B3D2E; padding:16px;">
  <div style="background:white; border-radius:16px; padding:18px;">
    <label style="font-size:13px; font-weight:800;">Your Full Name</label>
    <input id="wName" placeholder="Example: Chinedu O." style="width:100%; box-sizing:border-box; padding:12px; border:1px solid #ddd; border-radius:12px; margin:8px 0 14px; font-size:14px;">
    <label style="font-size:13px; font-weight:800;">Your Skill</label>
    <select id="wSkill" onchange="toggleCustomSkill()" style="width:100%; box-sizing:border-box; padding:12px; border:1px solid #ddd; border-radius:12px; margin:8px 0 14px; font-size:14px;"><option>Plumber</option><option>Electrician</option><option>Cleaner</option><option>Brick Layer</option><option>Carpenter</option><option>Painter</option><option>Welder</option><option>Gardener</option><option>Barber</option><option>Cook / Chef</option><option>Driver</option><option>Tailor</option><option value="Other">Other — Type My Skill</option></select>
    <div id="customSkillBox" style="display:none;">
      <label style="font-size:13px; font-weight:800;">Type Your Skill</label>
      <input id="wCustomSkill" placeholder="Example: Solar Installer, POP, Tiler, Mechanic..." style="width:100%; box-sizing:border-box; padding:12px; border:1px solid #0B6E4F; border-radius:12px; margin:8px 0 14px; font-size:14px;">
    </div>
    <label style="font-size:13px; font-weight:800;">Your Area / City</label>
    <input id="wCity" placeholder="Example: Wuse 2, Abuja" style="width:100%; box-sizing:border-box; padding:12px; border:1px solid #ddd; border-radius:12px; margin:8px 0 14px; font-size:14px;">
    <label style="font-size:13px; font-weight:800;">Your Price Per Job (₦)</label>
    <input id="wPrice" type="number" placeholder="Example: 8000" style="width:100%; box-sizing:border-box; padding:12px; border:1px solid #ddd; border-radius:12px; margin:8px 0 14px; font-size:14px;">
    <label style="font-size:13px; font-weight:800;">Job Description / What You Do</label>
    <textarea id="wDesc" placeholder="Example: I install solar panels, inverters and do house wiring. 5 years experience. I come with my tools. Fast and neat work..." style="width:100%; box-sizing:border-box; padding:12px; border:1px solid #ddd; border-radius:12px; margin:8px 0 14px; font-size:14px; min-height:90px;"></textarea>
    <p style="font-size:12px; color:#666; background:#F2F4F2; padding:10px; border-radius:10px; margin:0 0 14px;">🔒 No phone number needed. All chats happen inside ZIRO. Your contact stays private until you choose to share it in chat.</p>
    <button onclick="joinAsWorker()" style="width:100%; background:#0B6E4F; color:white; border:none; padding:15px; border-radius:12px; font-size:15px; font-weight:900;">Join ZIRO → Start Getting Jobs</button>
    <p style="font-size:12px; color:#888; text-align:center; margin:10px 0 0;">You will appear on Home + Search immediately.</p>
  </div>
</div>
<script src="js/notify.js"></script>
<script src="js/workers.js"></script>
<script>
function toggleCustomSkill(){ document.getElementById('customSkillBox').style.display = document.getElementById('wSkill').value==='Other' ? 'block' : 'none'; }
function joinAsWorker(){
  const name=document.getElementById('wName').value.trim();
  let skill=document.getElementById('wSkill').value;
  if(skill==='Other'){ skill=document.getElementById('wCustomSkill').value.trim(); }
  const city=document.getElementById('wCity').value.trim();
  const price=document.getElementById('wPrice').value.trim();
  const desc=document.getElementById('wDesc').value.trim();
  if(!name || !skill || !city || !price){ ziroNotify('Missing Info','Please fill Name, Skill, Area and Price.'); return; }
  ziroAddWorker({name:name, skill:skill, city:city, rating:'5.0', price:Number(price), jobs:0, about:desc || 'New trusted worker on ZIRO. Ready to work.'});
  ziroNotify('Welcome to ZIRO!', 'Hi '+name+', your profile is live as '+skill+'!<br>Customers can now find you.', 'View My Profile', function(){ localStorage.setItem('ziro_view_worker', name); window.location.href='worker.html?name='+encodeURIComponent(name); });
}
</script>
</body>
</html>
